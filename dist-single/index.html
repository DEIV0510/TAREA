US$1,19 billones`,`US$1,40 billones`,`US$421 mil millones`,`US$306 mil millones`],explain:`Fueron US$1,19 billones, un 8,9 % más que en 2024. US$1,40 billones es la proyección para 2027.`},{id:`q4`,type:`quiz`,slide:5,prompt:`¿Cuál es el mayor mercado publicitario del mundo?`,options:[`Estados Unidos`,`China`,`Australia`,`Brasil`],explain:`EE. UU. concentra el 35,3 % del total mundial (US$421 mil millones en 2025). China es el segundo, con unos US$200 mil millones.`},{id:`q5`,type:`quiz`,slide:8,prompt:`En «Comparte una Coca-Cola» (Australia, 2011), ¿qué se imprimió en las botellas?`,options:[`Los 150 nombres más populares del país`,`Los precios de la competencia`,`Fotos de futbolistas famosos`,`Un código de descuento`],explain:`Se imprimieron los 150 nombres más populares del país. En EE. UU. (2014) la campaña llegó con 250 nombres.`},{id:`q6`,type:`quiz`,slide:8,prompt:`¿Con qué agencia creó Coca-Cola la campaña «Comparte una Coca-Cola»?`,options:[`Ogilvy Sydney`,`WARC`,`Cannes Lions`,`Meta`],explain:`La creó con Ogilvy Sydney. WARC es la fuente de las cifras, Cannes Lions dio los premios y Meta es una plataforma.`},{id:`q7`,type:`quiz`,slide:8,prompt:`¿Qué problema tenía Coca-Cola antes de la campaña?`,options:[`Sus ventas en EE. UU. llevaban 11 años cayendo`,`Nadie conocía la marca`,`Su botella era difícil de abrir`,`No tenía dinero para publicidad`],explain:`Las ventas en EE. UU. llevaban 11 años seguidos en descenso y la marca perdía conexión con los jóvenes.`},{id:`a1`,type:`ad`,slide:6,prompt:Fp,options:[$.inf,$.per,$.rec,$.emo],explain:`Da a conocer un producto nuevo y sus datos: estrategia informativa (el ejemplo de la exposición era justo el lanzamiento de un celular).`,ad:{format:`story`,brand:`NovaPhone`,headline:`Nuevo NovaPhone X`,sub:`Batería de 3 días · cámara de 200 MP · desde el lunes`,art:`📱✨`,bg:`linear-gradient(170deg,#38bdf8,#1d4ed8)`,extra:{kind:`badge`,text:`¡NUEVO!`}}},{id:`a2`,type:`ad`,slide:6,prompt:Fp,options:[$.per,$.inf,$.rec,$.emo],explain:`Compara y resalta ventajas para que elijas esta marca sobre otra: estrategia persuasiva.`,ad:{format:`billboard`,brand:`FrescaCola`,headline:`¿Por qué pagar más? Menos azúcar, mismo sabor.`,sub:`FrescaCola vs. la otra`,art:`🥤⚖️`,bg:`linear-gradient(120deg,#ef4444,#f97316)`}},{id:`a3`,type:`ad`,slide:6,prompt:Fp,options:[$.emo,$.inf,$.per,$.rec],explain:`Conecta con la familia y la nostalgia de los domingos en casa: estrategia emocional.`,ad:{format:`poster`,brand:`Abuelita`,headline:`Como las galletas de los domingos en casa`,sub:`Hechas con amor, como antes`,art:`🍪👵💛`,bg:`linear-gradient(160deg,#f59e0b,#b45309)`}},{id:`a4`,type:`ad`,slide:6,prompt:Fp,options:[$.rec,$.inf,$.per,$.emo],explain:`No anuncia nada nuevo ni compara: solo mantiene la marca presente en la mente, como hacen Coca-Cola o McDonald’s. Es de recordación.`,ad:{format:`billboard`,brand:`BurgerMax`,headline:`BurgerMax`,sub:`Siempre cerca de ti`,art:`🍔`,bg:`linear-gradient(120deg,#ffd23f,#ef4444)`,fg:`#1b1036`}},{id:`a5`,type:`ad`,slide:6,prompt:Fp,options:[$.emo,$.per,$.inf,$.rec],explain:`Vende amistad y alegría, no datos del producto: estrategia emocional.`,ad:{format:`post`,brand:`chispalimon`,headline:`Amigos + playa + ChispaLimón`,sub:`Así se siente el verano`,art:`🏖️🍋`,bg:`linear-gradient(160deg,#22d3ee,#a3e635)`,fg:`#1b1036`}},{id:`a6`,type:`ad`,slide:6,prompt:Fp,options:[$.per,$.emo,$.inf,$.rec],explain:`Se compara con «los demás» y destaca una ventaja clara: estrategia persuasiva.`,ad:{format:`post`,brand:`turbonet`,headline:`El doble de velocidad al mismo precio`,sub:`TurboNet vs. los demás`,art:`🚀📶`,bg:`linear-gradient(160deg,#111827,#6d28d9)`,extra:{kind:`badge`,text:`2X más rápido`}}},{id:`a7`,type:`ad`,slide:6,prompt:Fp,options:[$.inf,$.emo,$.per,$.rec],explain:`Anuncia una mejora del producto: la informativa sirve para lo nuevo y también para las mejoras.`,ad:{format:`poster`,brand:`EcoLava`,headline:`NUEVO: ahora en cápsulas`,sub:`Una cápsula = una lavada`,art:`🫧🧺`,bg:`linear-gradient(160deg,#34d399,#0e7490)`,extra:{kind:`badge`,text:`Mejorado`}}},{id:`a8`,type:`ad`,slide:6,prompt:Fp,options:[$.rec,$.per,$.emo,$.inf],explain:`Una marca que todos conocen y que solo se deja ver para no ser olvidada: estrategia de recordación.`,ad:{format:`story`,brand:`PanDorado`,headline:`PanDorado. El de siempre.`,sub:`En tu mesa todos los días`,art:`🍞`,bg:`linear-gradient(170deg,#fbbf24,#b45309)`}},{id:`t1`,type:`tf`,slide:4,statement:`La publicidad es pagada: el anunciante compra el espacio o el tiempo en el medio.`,truth:!0,explain:`Realidad. «Pagada» es la primera característica de la exposición.`},{id:`t2`,type:`tf`,slide:4,statement:`En la publicidad hay contacto directo y personal con cada cliente.`,truth:!1,explain:`Mito. La publicidad es impersonal: no hay contacto directo con cada persona.`},{id:`t3`,type:`tf`,slide:4,statement:`Que la publicidad sea «identificable» significa que se sabe quién es el anunciante.`,truth:!0,explain:`Realidad. Siempre se sabe qué marca está detrás del anuncio.`},{id:`t4`,type:`tf`,slide:4,statement:`Hoy no hay forma de medir si una publicidad funciona.`,truth:!1,explain:`Mito. Es medible: hoy se miden el alcance, los clics y las ventas.`},{id:`t5`,type:`tf`,slide:5,statement:`China es el mayor mercado publicitario del mundo.`,truth:!1,explain:`Mito. El mayor es EE. UU. (35,3 % del total mundial); China es el segundo, con unos US$200 mil millones.`},{id:`t6`,type:`tf`,slide:7,statement:`Con la publicidad digital, una marca puede mostrar sus anuncios según la edad, los intereses y la ubicación de las personas.`,truth:!0,explain:`Realidad. La publicidad digital permite segmentar por edad, intereses y ubicación en Google, Meta y TikTok.`},{id:`t7`,type:`tf`,slide:8,statement:`La campaña «Comparte una Coca-Cola» nació en Estados Unidos.`,truth:!1,explain:`Mito. Nació en Australia en 2011 con Ogilvy Sydney; a EE. UU. llegó en 2014.`},{id:`t8`,type:`tf`,slide:5,statement:`Un «billón» en español equivale a un millón de millones.`,truth:!0,explain:`Realidad. Es lo que en inglés se llama «trillion». Por eso US$1,19 billones es muchísimo dinero.`},{id:`m1`,type:`match`,slide:4,prompt:`Une cada característica con su significado`,pairs:[[`Pagada`,`El anunciante compra el espacio o el tiempo`],[`Masiva`,`Llega a muchas personas a la vez`],[`Impersonal`,`No hay contacto directo con cada persona`],[`Identificable`,`Se sabe quién es el anunciante`]],explain:`Son cuatro de las siete características de la publicidad que vimos en la exposición.`},{id:`m2`,type:`match`,slide:4,prompt:`Une cada característica con su significado`,pairs:[[`Persuasiva`,`Busca influir en la decisión de compra`],[`Creativa`,`Combina imagen, mensaje y emoción`],[`Medible`,`Se miden alcance, clics y ventas`],[`La fórmula`,`Comunicar + persuadir + vender o recordar`]],explain:`La fórmula resume todo: comunicar + persuadir + vender o recordar.`},{id:`m3`,type:`match`,slide:6,prompt:`Une cada estrategia según el objetivo con lo que hace`,pairs:[[`Informativa`,`Da a conocer un producto nuevo o una mejora`],[`Persuasiva`,`Convence de elegir una marca sobre otra`],[`De recordación`,`Mantiene la marca presente en la mente`],[`Emocional`,`Conecta con familia, amistad, alegría o nostalgia`]],explain:`Las cuatro estrategias según el objetivo: informar, persuadir, recordar y emocionar.`},{id:`m4`,type:`match`,slide:7,prompt:`Une cada estrategia según el canal con su ejemplo`,pairs:[[`Publicidad digital`,`Anuncios segmentados en Google, Meta y TikTok`],[`Marketing de influencers`,`Personas con audiencia recomiendan la marca`],[`Publicidad exterior`,`Vallas en la calle`],[`Activaciones`,`Eventos y experiencias en el punto de venta`]],explain:`La exposición agrupó los canales en digital, influencers y exterior con activaciones.`},{id:`m5`,type:`match`,slide:5,prompt:`Une cada cifra con lo que representa`,pairs:[[`US$1,19 billones`,`Inversión publicitaria mundial en 2025`],[`US$1,40 billones`,`Proyección de inversión para 2027`],[`35,3 %`,`Parte del total mundial que concentra EE. UU.`],[`26,2 %`,`Parte del gasto total que va a redes sociales`]],explain:`Cifras de WARC: el mercado crece cada año y el dinero se mueve a lo digital.`},{id:`m6`,type:`match`,slide:9,prompt:`Une cada resultado de Coca-Cola con su significado`,pairs:[[`+870 %`,`Tráfico en el Facebook de Coca-Cola Australia`],[`+7 %`,`Consumo en jóvenes en Australia (2011)`],[`80+`,`Países que adoptaron la campaña`],[`+2,5 %`,`Ventas en EE. UU. tras el lanzamiento de 2014`]],explain:`Los resultados de «Comparte una Coca-Cola»: más consumo, más conversación y más ventas.`},{id:`m7`,type:`match`,slide:10,prompt:`Une cada clave del éxito de Coca-Cola con su explicación`,pairs:[[`Personalización`,`Cada persona encontraba su nombre en la botella`],[`Emoción`,`Vendía el momento de compartir con alguien`],[`Viralidad`,`La gente subía fotos y la campaña se difundía sola`],[`Cannes Lions`,`Premios de efectividad creativa que ganó la campaña`]],explain:`Lección: personalizar y emocionar vende más que solo mostrar el producto.`},{id:`c1`,type:`case`,slide:7,prompt:Ip,scenario:`Una marca de tenis paga para que su anuncio aparezca solo a personas de 18 a 25 años, de Bogotá, que siguen cuentas de running en Instagram.`,options:[`Publicidad digital segmentada`,`Marketing de influencers`,`Publicidad exterior`,`Activación en el punto de venta`],explain:`La publicidad digital permite segmentar por edad, intereses y ubicación en Google, Meta y TikTok.`},{id:`c2`,type:`case`,slide:7,prompt:Ip,scenario:`Una youtuber de maquillaje con 2 millones de seguidores recomienda una base y sus fans la compran porque confían en ella.`,options:[`Marketing de influencers`,`Publicidad digital segmentada`,`Publicidad exterior`,`Activación en el punto de venta`],explain:`Una persona con audiencia recomienda la marca y genera confianza: marketing de influencers.`},{id:`c3`,type:`case`,slide:7,prompt:Ip,scenario:`Una marca de helados arma un stand en un centro comercial donde la gente prueba sabores gratis y participa en un juego.`,options:[`Activación en el punto de venta`,`Marketing de influencers`,`Publicidad digital segmentada`,`Publicidad en buscadores`],explain:`Eventos y experiencias en el punto de venta hacen parte de la publicidad exterior y las activaciones.`},{id:`c4`,type:`case`,slide:6,prompt:Lp,scenario:`Una empresa lanza un comercial que explica las funciones de su nuevo celular y la fecha en que sale a la venta.`,options:[$.inf,$.emo,$.rec,$.per],explain:`Dar a conocer un producto nuevo es la estrategia informativa: justo el ejemplo del celular en la exposición.`},{id:`c5`,type:`case`,slide:6,prompt:Lp,scenario:`Una marca de gaseosa muestra a una familia reunida en Navidad, riendo en la mesa, sin hablar de precio ni de sabor.`,options:[$.emo,$.inf,$.per,$.rec],explain:`Familia, alegría y nostalgia: la estrategia emocional conecta con sentimientos.`},{id:`c6`,type:`case`,slide:6,prompt:Lp,scenario:`Una cadena de comidas rápidas muy famosa pone solo su logo en una valla gigante, sin promociones ni productos nuevos.`,options:[$.rec,$.inf,$.per,$.emo],explain:`Mantener la marca presente en la mente del consumidor es la estrategia de recordación (como Coca-Cola o McDonald’s).`},{id:`c7`,type:`case`,slide:6,prompt:Lp,scenario:`Un banco compara punto por punto sus tasas con las de otro banco para que la gente lo prefiera a él.`,options:[$.per,$.rec,$.emo,$.inf],explain:`Convencer de elegir una marca sobre otra resaltando ventajas y diferencias es la estrategia persuasiva.`},{id:`c8`,type:`case`,slide:10,prompt:`¿Qué hizo que esta campaña funcionara?`,scenario:`Coca-Cola imprime nombres en las botellas; la gente busca el suyo o el de un amigo y sube fotos a redes con «su» botella.`,options:[`Personalización y viralidad`,`Precio más bajo`,`Anuncios en prensa`,`Más azúcar en la fórmula`],explain:`Cada persona encontraba su nombre (personalización) y la gente subía fotos, así la campaña se difundía sola (viralidad).`},{id:`s1`,type:`sort`,slide:4,prompt:`¿Es una característica de la publicidad?`,bins:[`Sí lo es`,`No lo es`],items:[{text:`Pagada`,bin:0},{text:`Gratuita`,bin:1},{text:`Masiva`,bin:0},{text:`Contacto personal con cada cliente`,bin:1},{text:`Medible`,bin:0}],explain:`Las 7 características: pagada, persuasiva, masiva, impersonal, identificable, creativa y medible.`},{id:`s2`,type:`sort`,slide:3,prompt:`¿Es un medio tradicional o digital?`,bins:[`Tradicional`,`Digital`],items:[{text:`Televisión`,bin:0},{text:`Buscadores`,bin:1},{text:`Radio`,bin:0},{text:`Redes sociales`,bin:1},{text:`Vía pública`,bin:0}],explain:`La publicidad se difunde en TV, radio, prensa, vía pública, redes sociales y buscadores.`},{id:`s3`,type:`sort`,slide:6,prompt:`¿Es una estrategia según el objetivo o según el canal?`,bins:[`Objetivo`,`Canal`],items:[{text:`Informativa`,bin:0},{text:`Marketing de influencers`,bin:1},{text:`Emocional`,bin:0},{text:`Publicidad digital`,bin:1},{text:`De recordación`,bin:0}],explain:`Según el objetivo: informativa, persuasiva, de recordación y emocional. Según el canal: digital, influencers y exterior.`},{id:`s4`,type:`sort`,slide:6,prompt:`¿Este mensaje es emocional o informativo?`,bins:[`Emocional`,`Informativo`],items:[{text:`«Vuelve a casa por Navidad»`,bin:0},{text:`«Nuevo modelo con batería de 2 días»`,bin:1},{text:`«Para esos amigos de toda la vida»`,bin:0},{text:`«Disponible desde el 1 de marzo»`,bin:1},{text:`«El sabor que te recuerda tu infancia»`,bin:0}],explain:`Lo emocional apela a familia, amistad, alegría o nostalgia; lo informativo da a conocer lo nuevo.`},{id:`s5`,type:`sort`,slide:8,prompt:`Caso Coca-Cola: ¿era el problema o fue la solución?`,bins:[`Problema`,`Solución`],items:[{text:`Ventas en caída durante 11 años`,bin:0},{text:`Nombres impresos en las botellas`,bin:1},{text:`Pérdida de conexión con los jóvenes`,bin:0},{text:`Invitar a compartir con un amigo`,bin:1},{text:`Apodos como Mamá, Amigo o Bestie`,bin:1}],explain:`El problema: ventas en caída y marca lejana de los jóvenes. La solución: volver a hacerla personal.`},{id:`s6`,type:`sort`,slide:5,prompt:`¿Es un dato real de 2025 o una proyección?`,bins:[`Dato 2025`,`Proyección`],items:[{text:`US$1,19 billones de inversión mundial`,bin:0},{text:`US$1,30 billones de inversión mundial`,bin:1},{text:`US$421 mil millones en EE. UU.`,bin:0},{text:`US$1,40 billones de inversión mundial`,bin:1},{text:`Cerca de US$150 por persona`,bin:1}],explain:`2025 cerró en US$1,19 billones; para 2026 se proyectan US$1,30 y para 2027 US$1,40 (cerca de US$150 por persona).`},{id:`i1`,type:`odd`,slide:4,prompt:`¿Cuál NO es una característica de la publicidad?`,options:[`Gratuita`,`Masiva`,`Medible`,`Identificable`],explain:`La publicidad es pagada: el anunciante compra el espacio o el tiempo en el medio.`},{id:`i2`,type:`odd`,slide:6,prompt:`¿Cuál NO es una estrategia según el objetivo?`,options:[`Impersonal`,`Informativa`,`Persuasiva`,`Emocional`],explain:`«Impersonal» es una característica. Las estrategias según el objetivo son informativa, persuasiva, de recordación y emocional.`},{id:`i3`,type:`odd`,slide:7,prompt:`¿Cuál NO es una estrategia según el canal?`,options:[`De recordación`,`Publicidad digital`,`Marketing de influencers`,`Publicidad exterior`],explain:`«De recordación» es una estrategia según el objetivo, no según el canal.`},{id:`i4`,type:`odd`,slide:10,prompt:`¿Cuál NO fue una razón del éxito de «Comparte una Coca-Cola»?`,options:[`Bajar el precio`,`Personalización`,`Emoción`,`Viralidad`],explain:`Funcionó por personalización, emoción y viralidad. El precio no fue parte de la idea.`},{id:`i5`,type:`odd`,slide:7,prompt:`¿Cuál NO está entre las empresas que concentran el 56,1 % de la inversión publicitaria?`,options:[`Coca-Cola`,`Alphabet`,`Amazon`,`Meta`],explain:`Alphabet, Amazon y Meta concentran el 56,1 % (2025, sin China). Coca-Cola es un anunciante, no una plataforma.`},{id:`i6`,type:`odd`,slide:3,prompt:`¿Cuál NO es un medio donde se difunde la publicidad?`,options:[`Una carta escrita a mano a un amigo`,`Televisión`,`Buscadores`,`Vía pública`],explain:`Los medios: TV, radio, prensa, vía pública, redes sociales y buscadores. Una carta personal no es masiva ni pagada.`},{id:`i7`,type:`odd`,slide:9,prompt:`¿Cuál NO fue un resultado de la campaña de Coca-Cola?`,options:[`Bajó el precio de la botella`,`+870 % de tráfico en Facebook`,`Más de 80 países la adoptaron`,`+2,5 % de ventas en EE. UU.`],explain:`Los resultados: +7 % de consumo en jóvenes, +870 % de tráfico en Facebook, 80+ países y +2,5 % de ventas en EE. UU.`},{id:`o1`,type:`order`,slide:8,prompt:`Ordena la historia de «Comparte una Coca-Cola»`,steps:[`Las ventas llevaban 11 años cayendo`,`Ogilvy Sydney crea la idea en Australia`,`Se imprimen 150 nombres en las botellas`,`La gente sube fotos y la campaña se hace viral`],explain:`Problema → idea → ejecución → viralidad: así pasó de marca lejana a marca personal.`},{id:`o2`,type:`order`,slide:10,prompt:`Ordena cómo se volvió viral «Comparte una Coca-Cola»`,steps:[`Buscas tu nombre o el de un amigo en la botella`,`Compartes la Coca-Cola con esa persona`,`Subes la foto a redes sociales`,`La campaña se difunde sola`],explain:`La invitación era buscar un nombre y compartir; la gente subía fotos a redes y la campaña se difundía sola: eso es viralidad.`},{id:`o3`,type:`order`,slide:3,prompt:`Ordena cómo funciona la publicidad, según su definición`,steps:[`La marca paga un espacio en un medio`,`Da a conocer su producto, servicio o idea`,`Persuade al público`,`El público lo compra o lo recuerda`],explain:`Comunicar + persuadir + vender o recordar.`},{id:`o4`,type:`order`,slide:9,prompt:`Ordena estos números del caso Coca-Cola de MAYOR a MENOR`,steps:[`870 (% de tráfico en Facebook)`,`250 (nombres en EE. UU.)`,`150 (nombres en Australia)`,`80+ (países)`,`11 (años de caída)`],explain:`Todas son cifras del caso: 11 años de caída, 150 y luego 250 nombres, 80+ países y +870 % en Facebook.`},{id:`o5`,type:`order`,slide:2,prompt:`Ordena l
